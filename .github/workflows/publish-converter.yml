name: publish converter-base

# Builds converter-base for linux/amd64 and linux/arm64 and publishes a
# multi-arch manifest to GHCR:
#
#   ghcr.io/<owner>/converter-base:<major>.<minor>.<patch>
#   ghcr.io/<owner>/converter-base:<major>.<minor>
#   ghcr.io/<owner>/converter-base:latest
#
# Trigger: push a semantic version git tag, e.g.
#
#   git tag 1.3.0 && git push origin 1.3.0
#
# The OpenUSD version is pinned in converter-base/Dockerfile (USD_VERSION). The
# workflow resolves the matching usd-base-ar manifest digest and pins the build
# to it, so a converter-base tag is always reproducible against one exact base.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 1.3.0). Builds the checked-out ref.'
        required: true
        type: string

env:
  REGISTRY: ghcr.io

concurrency:
  group: publish-converter-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: resolve base image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      version:      ${{ steps.derive.outputs.version }}
      minor:        ${{ steps.derive.outputs.minor }}
      usd_version:  ${{ steps.derive.outputs.usd_version }}
      image:        ${{ steps.derive.outputs.image }}
      base_ref:     ${{ steps.derive.outputs.base_ref }}
      base_digest:  ${{ steps.derive.outputs.base_digest }}
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: derive build parameters
        id: derive
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            version="${GITHUB_REF#refs/tags/}"
          else
            version="${INPUT_VERSION}"
          fi
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "error: '${version}' is not a semantic version (expected MAJOR.MINOR.PATCH)" >&2
            exit 1
          fi
          minor="${version%.*}"

          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          image="${REGISTRY}/${owner}/converter-base"

          usd_version="$(sed -n 's/^ARG USD_VERSION=\(.*\)$/\1/p' converter-base/Dockerfile | head -n1)"
          if [[ -z "${usd_version}" ]]; then
            echo "error: could not read USD_VERSION from converter-base/Dockerfile" >&2
            exit 1
          fi

          base_ref="${REGISTRY}/${owner}/usd-base-ar:${usd_version}"
          if ! base_digest="$(docker buildx imagetools inspect "${base_ref}" --format '{{ .Manifest.Digest }}')"; then
            echo "error: ${base_ref} is not in the registry. Publish OpenUSD ${usd_version} first (publish images workflow)." >&2
            exit 1
          fi

          {
            echo "version=${version}"
            echo "minor=${minor}"
            echo "usd_version=${usd_version}"
            echo "image=${image}"
            echo "base_ref=${base_ref}"
            echo "base_digest=${base_digest}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### converter-base ${version}"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| image | \`${image}\` |"
            echo "| tags | \`${version}\`, \`${minor}\`, \`latest\` |"
            echo "| OpenUSD | \`${usd_version}\` |"
            echo "| base | \`${base_ref}\` |"
            echo "| base digest | \`${base_digest}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build converter-base (${{ matrix.platform }})
    needs: resolve
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner:   ubuntu-latest
          - platform: linux/arm64
            runner:   ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - name: prepare platform pair
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: checkout
        uses: actions/checkout@v4

      - name: setup buildx
        uses: docker/setup-buildx-action@v3

      - name: login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: converter-base
          file: converter-base/Dockerfile
          platforms: ${{ matrix.platform }}
          # Pin to the exact usd-base-ar manifest resolved above.
          build-args: |
            BASE_IMAGE=${{ needs.resolve.outputs.base_ref }}@${{ needs.resolve.outputs.base_digest }}
          labels: |
            org.opencontainers.image.version=${{ needs.resolve.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.base.name=${{ needs.resolve.outputs.base_ref }}
            org.opencontainers.image.base.digest=${{ needs.resolve.outputs.base_digest }}
          outputs: type=image,name=${{ needs.resolve.outputs.image }},push-by-digest=true,name-canonical=true,push=true

      - name: smoke test
        # Pull the platform image just pushed and exercise every tool,
        # including a real glTF -> USDZ conversion and KTX2/WebP encodes.
        run: |
          set -euo pipefail
          ref="${{ needs.resolve.outputs.image }}@${{ steps.build.outputs.digest }}"
          docker pull "${ref}"
          scripts/smoke-test-converter.sh "${ref}"

      - name: export digest
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

      - name: upload digest
        uses: actions/upload-artifact@v4
        with:
          name: converter-digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: publish converter-base manifest
    needs: [resolve, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: converter-digests-*
          merge-multiple: true

      - name: setup buildx
        uses: docker/setup-buildx-action@v3

      - name: login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: create multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          image="${{ needs.resolve.outputs.image }}"
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            -t "${image}:${{ needs.resolve.outputs.version }}" \
            -t "${image}:${{ needs.resolve.outputs.minor }}" \
            -t "${image}:latest" \
            $(printf "${image}@sha256:%s " *)

      - name: inspect
        run: |
          set -euo pipefail
          image="${{ needs.resolve.outputs.image }}"
          docker buildx imagetools inspect "${image}:${{ needs.resolve.outputs.version }}"
          {
            echo "### Published"
            echo
            echo "- \`${image}:${{ needs.resolve.outputs.version }}\`"
            echo "- \`${image}:${{ needs.resolve.outputs.minor }}\`"
            echo "- \`${image}:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
